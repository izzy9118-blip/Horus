declared_gap:
  id: UKR-2026-08-GAP-001
  subject: the American backstop behind a European security guarantee to Ukraine
  state: DECLARED_NOT_FILLED
  what_was_searched: >-
    whitehouse.gov briefings, statements, presidential actions and fact sheets;
    state.gov press releases.
  what_was_found: >-
    No 2026 statement in which the United States specifies its backstop position.
    On the record instead: a refusal to specify dated 2025-04-18; a framework text
    of 2025-11-23 that refers final decisions to the two presidents without
    stating what the United States underwrites; and a fact sheet of 2026-07-08
    whose subject is allied burden-shifting.
  status: >-
    Recorded as a gap in the record, not as a finding about American intentions.
    The reading of an absence belongs to a minister, not to the eyes.
