principle: >-
  A board names the principals whose files must exist before any minister reasons
  on it. Naming the roster is a scope act, not a judgment: it says who is on the
  board, never what any of them is doing. Persons and bodies are never merged.

closure: >-
  This board is CLOSED. The files were gathered with no reading in view and
  frozen at the date above. A minister - whether a harness run or a room - reads
  this board and may not add to it. If the ground is wrong, the remedy is a new
  board with a new date, not an edit made while a reading is forming. The
  invisible curator enters exactly here: through the gatherer who is also the
  judge, adding the fact his reading turned out to need.

