roster_note: >-
  Germany enters this board through its operative principal, per owner ruling:
  Europe is led by Germany as well, and a board that seats Europe only as an
  abstraction seats nobody. Body and person are filed separately, as the charter
  requires.

decay_tolerance_days:
  note: >-
    Charter defaults, not overridden. T4 is 7 days because this is a war board.
  T1: 90
  T2: 30
  T3: 60
  T4: 7
  T5: 30

gate_rule: >-
  PASS only if all principals' files exist with T1, T2, and T4 FILLED and within
  tolerance. T1 is filled only on original-language primary matter, per charter
  amendment HORUS-AMD-001. Otherwise HOLD, with the gaps named.

standing_question: >-
  The American backstop position behind a European security guarantee to Ukraine.
  Declared in files/united-states.md as a gap in the record: the principal's own
  channels were searched and no 2026 statement specifying that position was
  found.
