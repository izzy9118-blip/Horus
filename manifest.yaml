identity:
  organ: horus
  role: eyes of the Assembly
  sanctum_contract:
    gate: referenced by hub
    files: held here
status: FOUNDING
completeness: PENDING_PROBE
safeguards:
  - no_judgment
  - no_self_certification
  - tier_order_is_law
  - decay_enforced
  - queries_logged
  - original_language_t1_required
  - minister_queries_require_source_provenance
  - horus_retains_source_selection_independence
  - adversarial_queries_are_distinct_and_mandatory_before_final_reasoned_judgment
  - source_absence_states_must_not_collapse
  - deterministic_primary_source_acquisition_required
  - searched_not_found_requires_completed_reachable_protocol
query_contract:
  response_schema: contracts/horus-query-response.schema.json
  response_schema_version: 1.3.0
  predecessor_response_schema: contracts/horus-query-response.schema.v1.2.0.json
  historical_response_schemas:
    - contracts/horus-query-response.schema.v1.1.0.json
  accepted_query_prefixes:
    - MHQ
    - MHAQ
  required_response_states:
    - GATHERED
    - PARTIALLY_GATHERED
    - NOT_GATHERED
  source_absence_taxonomy: HORUS-SOURCE-STATE-1.0
  returned_evidence_states:
    - SUPPORTED
    - CONTRADICTORY_RECORD
    - DOCUMENTED_ABSENCE
  unresolved_evidence_states:
    - NOT_SEARCHED
    - SEARCHED_NOT_FOUND
    - SOURCE_EXISTS_NOT_ACQUIRED
    - SOURCE_ACQUIRED_INCOMPLETE
  completeness: PENDING_PROBE
  source_selection_rule: HORUS_RETAINS_SOURCE_SELECTION_INDEPENDENCE_EXCEPT_EXPLICIT_DOCUMENT_REQUESTS
  required_source_disclosure:
    - sources_searched
    - sources_used
    - sources_rejected_with_reason
    - records_returned_with_source_refs
    - unfilled_requests_with_reason
    - acquisition_search_attempts
    - horus_repository_commit
    - retrieval_time
acquisition_contract:
  protocol: HORUS-ACQUISITION-1.0
  principal_profile_schema: contracts/principal-source-profile.schema.json
  receipt_schema: contracts/acquisition-receipt.schema.json
  canonical_engine: runtime/gather.py
  principal_registry: registry/principals
  date_normalization: CODE_ONLY_NO_MODEL_CALENDAR_GUESSING
  minimum_original_language_t1_steps:
    - DIRECT_FIRST_PARTY_ARCHIVE
    - DIRECT_FIRST_PARTY_SITE_SEARCH
    - ALTERNATE_FIRST_PARTY_CHANNEL
    - FIRST_PARTY_DOMAIN_RECOVERY
  secondary_discovery_rule: MAY_DISCOVER_PRIMARY_BUT_NEVER_SUBSTITUTE_FOR_T1
  searched_not_found_rule: ALL_REQUIRED_STEPS_ATTEMPTED_AND_REACHABLE
  fail_closed_without_attempt_trace: NOT_SEARCHED
  completeness: PENDING_PROBE
charter_amendments:
  - id: HORUS-AMD-001
    name: the language tooth
    date: 2026-08-06
    status: RATIFIED_BY_OWNER
    amends:
      - charter.md, T1 tier definition
      - charter.md, the file header standard
      - charter.md, the parity gate
    effect: >-
      T1 is FILLED only on original-language primary matter. Translations are
      admissible as marked supplements and do not fill the tier. The parity
      manifest records per-principal T1 language and language state, and a T1
      declared FILLED on translation alone is recorded as a gap.
    rationale: >-
      Three consecutive proving-run inversions - Iran once, Russia twice - each
      traced to a principal heard only through English or derivative sources. The
      reading inverted each time the original-language record arrived.
  - id: HORUS-AMD-002
    name: minister-directed gathering with source provenance
    date: 2026-08-07
    status: RATIFIED_BY_OWNER
    amends:
      - charter.md, minister queries
      - charter.md, source-selection boundary
      - charter.md, provenance return requirements
    effect: >-
      Every reasoned ministerial run must make an attributable request to Horus.
      The minister states what it needs to know and what would count as adequate
      evidence. Horus retains source-selection independence except for explicit
      document requests and returns the complete searched, used, rejected, and
      unfilled source trail with completeness PENDING_PROBE.
    rationale: >-
      Ministers require a hard investigative interface rather than a soft prose
      permission to query. The interface must increase ministerial intelligence
      without recreating the failed condition in which the judge silently lays
      its own ground.
  - id: HORUS-AMD-003
    name: adversarial gathering before final judgment
    date: 2026-08-08
    status: RATIFIED_BY_OWNER
    amends:
      - charter.md, adversarial gathering
      - contracts/horus-query-response.schema.json
    effect: >-
      After a minister states a provisional judgment and what documentary ground
      could weaken, qualify, or overturn each proposition, Horus must receive a
      distinct MHAQ adversarial request and gather responsive ground before final
      reasoned judgment. Horus remains a gatherer and never decides whether the
      returned material defeats the proposition.
    rationale: >-
      A general instruction to seek disconfirming evidence is too soft. The
      Assembly needs an auditable hard call that exposes provisional judgment to
      contrary or complicating ground while preserving Horus source-selection
      independence and the rule that NOT_GATHERED is not confirmation.
  - id: HORUS-AMD-004
    name: source-absence taxonomy
    date: 2026-08-08
    status: RATIFIED_BY_OWNER
    amends:
      - charter.md, source-absence taxonomy
      - contracts/horus-query-response.schema.json
    effect: >-
      Every returned or unresolved information need carries an explicit epistemic
      state. Search failure, inaccessible sources, incomplete acquisition,
      contradictory records, and positively documented absence are machine-distinct.
      DOCUMENTED_ABSENCE requires positive source ground; unresolved states may
      never assert absence.
    rationale: >-
      An AI system must not convert ignorance into negative evidence. The state of
      the search and the state of the world are separate facts and must remain so
      in the record.
  - id: HORUS-AMD-005
    name: deterministic primary-source acquisition
    date: 2026-08-10
    status: RATIFIED_BY_OWNER
    amends:
      - charter.md, deterministic primary-source acquisition
      - contracts/horus-query-response.schema.json
      - contracts/principal-source-profile.schema.json
      - contracts/acquisition-receipt.schema.json
      - runtime/gather.py
    effect: >-
      Original-language T1 gaps must carry a deterministic acquisition receipt.
      Principal language, timezone, calendar and first-party channels are resolved
      from a pinned registry; dates are normalized in code; the minimum first-party
      search ladder is fixed; and SEARCHED_NOT_FOUND is forbidden unless every
      required step was both attempted and reachable. The canonical Horus runtime
      owns the receipt, source-state floor, provenance commit and fail-closed result.
    rationale: >-
      The 2026-08-10 U.S.-Iran proving inquiry exposed a retrieval-layer failure:
      10 August 2026 was manually converted to 20 Mordad 1405 instead of 19 Mordad,
      and ad-hoc external search was allowed to stand in for an exhausted first-party
      acquisition procedure. The system correctly noticed a T1 gap but could not
      prove that it had searched for the source correctly. The acquisition procedure
      must therefore become constitutional, machine-recorded and executable.
