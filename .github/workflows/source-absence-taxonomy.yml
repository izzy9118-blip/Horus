name: Horus Source-Absence Taxonomy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema test dependencies
        run: python -m pip install jsonschema pytest
      - name: Parse manifest and response contracts
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('contracts/horus-query-response.schema.json'),
              Path('contracts/horus-query-response.schema.v1.1.0.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          print('contracts parse')
          PY
      - name: Run source-absence response schema tests
        run: python -m pytest -q tests/test_query_response_schema.py
